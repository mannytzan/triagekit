title: Suspicious PowerShell Encoded Command
id: 77b23624-9db8-4d75-8c72-ef749f3e1b20
status: test
description: Detects PowerShell launched with an encoded command argument, a behavior frequently used to obscure execution.
author: TriageKit
date: 2026-07-18
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
  condition: all of selection_*
falsepositives:
  - Administrative automation and software deployment tools using encoded PowerShell
level: medium
tags:
  - attack.execution
  - attack.t1059.001
