title: Windows Event Logs Cleared with Wevtutil
id: a5cc7644-ae02-45a8-9e8b-9ad0b10f88b8
status: test
description: Detects wevtutil clearing a Windows event log, which may remove evidence of malicious activity.
author: TriageKit
date: 2026-07-18
references:
  - https://attack.mitre.org/techniques/T1685/005/
logsource:
  category: process_creation
  product: windows
detection:
  image:
    Image|endswith: '\wevtutil.exe'
  clear_command:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  condition: image and clear_command
falsepositives:
  - Approved log maintenance, image preparation, or troubleshooting
level: high
tags:
  - attack.defense-evasion
  - attack.t1685.005
