title: Windows Credential Registry Hive Saved to Disk
id: 267a5c50-8471-43fe-bf2a-7070f8e985ea
status: test
description: Detects reg.exe saving the SAM, SECURITY, or SYSTEM hives, a common precursor to offline credential extraction.
author: TriageKit
date: 2026-07-18
references:
  - https://attack.mitre.org/techniques/T1003/002/
  - https://attack.mitre.org/techniques/T1003/004/
logsource:
  category: process_creation
  product: windows
detection:
  image:
    Image|endswith: '\reg.exe'
  save_command:
    CommandLine|contains: ' save '
  sensitive_hive:
    CommandLine|contains:
      - 'hklm\sam'
      - 'hklm\security'
      - 'hklm\system'
      - 'hkcc\system'
  condition: image and save_command and sensitive_hive
falsepositives:
  - Authorized backup, forensic acquisition, or recovery operations
level: high
tags:
  - attack.credential-access
  - attack.t1003.002
  - attack.t1003.004
