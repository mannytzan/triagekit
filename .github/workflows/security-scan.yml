name: Organization Security Scan

# Scan changes to the primary branches and rescan weekly for newly disclosed CVEs.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC.

# The reusable workflow cannot elevate the permissions granted by this caller.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scan:
    uses: mannytzan/IaC-Security-Scanning-Pipeline/.github/workflows/security-scan.yml@39b5cb5266248d6ad52945b2abe928f8784b219f
    with:
      # TriageKit is a Go project, so initialize only the relevant CodeQL extractor.
      codeql_languages: go
