name: Organization Security Scan

# Scan changes to the primary branches and rescan weekly for newly disclosed CVEs.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 1" # Every Monday at 00:00 UTC.

# The reusable workflow cannot elevate the permissions granted by this caller.
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security-scan:
    uses: mannytzan/IaC-Security-Scanning-Pipeline/.github/workflows/security-scan.yml@33a555af5ca74e6d730ae17fb7a1eadc76e6a962
    with:
      # TriageKit is a Go project, so initialize only the relevant CodeQL extractor.
      codeql_languages: go
      # Portable mode works in private repositories without GitHub Code Security.
      github_code_scanning_enabled: false
