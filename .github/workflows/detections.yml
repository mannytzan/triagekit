name: detections

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Sigma toolchain
        run: |
          python -m pip install \
            sigma-cli==3.1.0 \
            pysigma-backend-splunk==2.1.0 \
            pysigma-backend-elasticsearch==2.1.0 \
            pysigma-backend-crowdstrike==3.0.0
      - run: go test ./...
      - run: go vet ./...
      - run: go run . validate
      - run: go run . convert
      - name: Upload generated queries
        uses: actions/upload-artifact@v4
        with:
          name: sigma-queries
          path: generated/
